# cargo-deny configuration — supply-chain checks for advisories, licenses,
# banned crates, and dependency sources. See https://embarkstudios.github.io/cargo-deny/
# Checked in CI (.github/workflows/deny.yml) across all features.

[graph]
# Include optional/feature deps (e.g. the `sound` feature's rodio stack).
all-features = true

[advisories]
version = 2
# Refuse dependencies the registry has yanked.
yanked = "deny"
# Add specific RUSTSEC ids here only with a written justification.
ignore = [
    # quick-xml DoS advisories (quadratic attribute-duplicate check;
    # unbounded namespace-declaration allocation). Both require PARSING
    # untrusted/attacker-controlled XML. coffeebreak never does:
    #   * self_update is used only through its GitHub backend, which speaks
    #     the JSON API — the XML path (self_update's S3 backend) is never
    #     compiled in or called here.
    #   * tauri-winrt-notification (Windows-only) *serialises* toast XML from
    #     our own notification strings; it does not parse untrusted input, and
    #     it isn't built on non-Windows targets at all.
    # No stable dependency tree reaches quick-xml >= 0.41 yet: self_update
    # 0.44 and notify-rust 4.18 still require quick-xml 0.38. Revisit when
    # self_update ships a stable release on the fixed quick-xml.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# Permissive licenses acceptable for an MIT OR Apache-2.0 project.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    # Community Data License Agreement — Permissive 2.0; used by the bundled
    # webpki root certificates (via reqwest/rustls in self_update).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions and wildcard deps are worth knowing about, but shouldn't
# fail the build on their own.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
