name: Feature request
description: Suggest an idea or improvement for coffeebreak.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like coffeebreak to do? A CLI sketch helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: Timer / UI / animation
        - label: Statistics
        - label: Configuration / CLI
        - label: Internationalisation (a new or improved translation)
        - label: Packaging / installation
