# Check for accidental SemVer-breaking changes to the public `coffeebreak`
# library API on pull requests. Advisory to start with (do not add to branch
# protection until it has proven trustworthy on this repo); promote to required
# once you are confident in it.
name: SemVer

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver-checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `sound` feature adds public items (ChimePlayer), so diff the API with
      # all features enabled to cover the whole surface.
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features
