# Code coverage via cargo-llvm-cov. Produces an lcov artifact and a summary in
# the job log; uploads to Codecov only if a CODECOV_TOKEN secret is configured.
name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Collect once with --no-report, then render multiple report formats.
      - name: Collect coverage
        run: cargo llvm-cov --locked --all-targets --no-report
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - name: Export lcov
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
      # Optional: only runs when a Codecov token is configured.
      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false
