# Check Markdown links with lychee.
#
# Two postures:
#   * on PRs/pushes touching docs — an OFFLINE check (no network), so it is fast,
#     deterministic, and fork-safe; this one blocks.
#   * weekly — a full ONLINE check of every Markdown file that opens a tracking
#     issue on failure instead of failing the run (external links rot over time
#     and should not break CI).
name: Links

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
      - ".lycheeignore"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC (staggered after the audit job)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic, fork-safe: verify that local link targets (files) exist
  # without any network access. (`--offline` does not validate `#anchor`
  # fragments; that would need `--include-fragments`.) Runs on pushes/PRs.
  offline:
    name: offline link check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: lychee (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --verbose README.md CONTRIBUTING.md CHANGELOG.md"
          fail: true

  # Weekly online sweep: report rot without blocking; open/refresh an issue.
  online:
    name: online link check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: lychee (online)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--verbose --no-progress './**/*.md'"
          fail: false
      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found by the weekly lychee sweep
          content-filepath: ./lychee/out.md
          labels: docs, automated
