# Detect unused crate dependencies with cargo-shear. Shear understands optional
# (`dep:rodio`) and target-gated (`cfg(unix)` libc) dependencies, so it does not
# false-positive on coffeebreak's feature/platform deps.
name: Unused dependencies

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/unused-deps.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: unused-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-shear:
    name: cargo shear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear
      - run: cargo shear
