# Release workflow for coffeebreak.
#
# Triggered when a version tag (e.g. v1.0.0) is pushed. It cross-builds the
# `coffeebreak` binary for all six supported target triples, packages each one
# as a release asset whose filename embeds the Rust target triple (so the
# `self_update` crate can locate the right asset), generates a single
# SHA256SUMS file over all assets, and publishes a GitHub Release.
#
# Asset naming contract (MUST stay byte-identical with install.sh / install.ps1):
#   Unix:    coffeebreak-<TARGET>.tar.gz  (binary `coffeebreak`     at archive root)
#   Windows: coffeebreak-<TARGET>.zip     (binary `coffeebreak.exe` at archive root)
#   Checksums: SHA256SUMS in `sha256sum` format -> "<64-hex><2 spaces><filename>"
#
# NOTE: The published crate is `coffeebreak-cli`, but the [[bin]] is `coffeebreak`,
# so the produced executable is always `coffeebreak` (or `coffeebreak.exe`).
name: release

on:
  push:
    tags:
      - "v*" # any tag starting with v, e.g. v1.0.0
  workflow_dispatch: {} # allow manual runs from the Actions tab

# The final job needs write access to create the Release and upload assets.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Gate the release: the tag must match Cargo.toml, and fmt/lint/tests pass.
  # (CI runs on branches/PRs, not on tags, so we re-check here.)
  # ---------------------------------------------------------------------------
  check:
    name: pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version *=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$tag  cargo=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Build + package one archive per target triple.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one target failing should not cancel the others
      matrix:
        include:
          # Linux x86_64: native build on Ubuntu.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          # Linux aarch64: cross-compile on Ubuntu using the aarch64 GNU linker.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # macOS x86_64 (Intel).
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          # macOS aarch64 (Apple Silicon).
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          # Windows x86_64 (MSVC).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          # Windows aarch64 (MSVC). Builds via MSVC cross target on x64 runner.
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pinned stable Rust toolchain; install the requested target triple too.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache cargo registry/git and the target dir to speed up rebuilds.
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      # Install the aarch64 GNU cross-linker for the Linux aarch64 target only.
      # We point Cargo at it via CARGO_TARGET_<TRIPLE>_LINKER below.
      #
      # NOTE on ALSA: the optional `sound` feature (rodio) needs libasound2-dev,
      # but the DEFAULT build does not enable `sound`, so we deliberately build
      # WITHOUT --features sound and therefore do NOT install ALSA dev headers.
      - name: Install aarch64 cross linker (Linux only)
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Build the release binary. We pass --locked because Cargo.lock is
      # committed; the default feature set is used (no `sound`).
      # The linker env var only affects the aarch64 Linux cross build; it is
      # harmless/unused for the other targets.
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Package the Unix binary as a gzipped tar with `coffeebreak` at the root.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar czf "coffeebreak-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" coffeebreak

      # Package the Windows binary as a zip with `coffeebreak.exe` at the root.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/coffeebreak.exe" `
            -DestinationPath "coffeebreak-${{ matrix.target }}.zip"

      # Upload the single archive produced by this job for the release step.
      # Unix produces .tar.gz, Windows produces .zip; the glob captures whichever.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: coffeebreak-${{ matrix.target }}
          path: |
            coffeebreak-${{ matrix.target }}.tar.gz
            coffeebreak-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Collect all archives, compute SHA256SUMS, and publish the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release & upload assets
      id-token: write # build provenance attestation (Sigstore)
      attestations: write
    steps:
      # Checkout so we can read CHANGELOG.md for the release notes.
      - name: Checkout
        uses: actions/checkout@v6

      # Download every build job's artifact into ./dist, flattening the
      # per-artifact subdirectories so all archives sit side by side.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Pull this version's section out of CHANGELOG.md for the release body.
      # Falls back to a generic line; auto-generated notes are appended below.
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="$RUNNER_TEMP/notes.md"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > "$out" || true
          if [ ! -s "$out" ]; then
            printf "Release %s.\n" "$GITHUB_REF_NAME" > "$out"
          fi
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # Generate shell completions and a man page from the freshly built Linux
      # binary, and bundle them as an extra release asset (useful for packagers).
      - name: Generate completions and man page
        working-directory: dist
        run: |
          set -euo pipefail
          tar xzf coffeebreak-x86_64-unknown-linux-gnu.tar.gz
          chmod +x coffeebreak
          mkdir -p completions
          for sh in bash zsh fish powershell elvish; do
            ./coffeebreak completions "$sh" > "completions/coffeebreak.$sh"
          done
          ./coffeebreak man > coffeebreak.1
          tar czf coffeebreak-completions.tar.gz completions coffeebreak.1
          # Don't leave the loose binary/dir around to be globbed/attached.
          rm -rf coffeebreak completions

      # Generate a single SHA256SUMS file in `sha256sum` format. We cd into the
      # dist dir so the filenames recorded are bare (no `dist/` prefix), which
      # is what the install scripts grep for.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # List archives deterministically; fail if none were found.
          shopt -s nullglob
          files=( coffeebreak-*.tar.gz coffeebreak-*.zip )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release archives found in dist/" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

      # Cryptographically attest that these archives were built by this workflow.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/coffeebreak-*.tar.gz
            dist/coffeebreak-*.zip

      # Create (or update) the GitHub Release for this tag and attach every
      # archive plus the checksums file. github.ref_name is the tag (e.g. v1.0.0)
      # on tag pushes; on workflow_dispatch it is the branch/tag chosen.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            dist/coffeebreak-*.tar.gz
            dist/coffeebreak-*.zip
            dist/coffeebreak.1
            dist/SHA256SUMS

  # ---------------------------------------------------------------------------
  # Publish the crate to crates.io — only when a CARGO_REGISTRY_TOKEN secret is
  # configured (otherwise it skips cleanly, so forks without the secret are fine).
  # ---------------------------------------------------------------------------
  publish-crate:
    name: publish to crates.io
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish (skips if no token)
        shell: bash
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked
