# coffeebreak configuration (OPTIONAL)
#
# coffeebreak works fine with NO config file at all, falling back to the
# built-in defaults shown below. This file just lets you change those defaults
# without typing flags every time.
#
# Where it goes (same path on Linux, macOS, and Windows):
#
#     $HOME/.config/coffeebreak/config.toml
#     # or, if set:  $XDG_CONFIG_HOME/coffeebreak/config.toml
#
# You can generate this file automatically with:
#
#     coffeebreak config init
#
# and find or inspect it with:
#
#     coffeebreak config path
#     coffeebreak config show
#
# Any key you omit keeps its default. Command-line flags (e.g. -w/--work,
# -b/--break, --cycles, --theme) ALWAYS override the values set here.

work_minutes = 25           # length of a focus block, in minutes
break_minutes = 5           # length of a short break, in minutes
long_break_minutes = 15     # length of a long break, in minutes
cycles = 1                  # number of focus -> break rounds to run
long_break_every = 4        # take a long break after this many focus blocks
long_break = false          # enable long breaks
sound = true                # audible cue on phase change (terminal bell, or chime if built with sound)
notifications = true        # show a desktop notification on phase change
git_label = false           # use the current git branch name as the session label
theme = "coffee"            # one of: coffee, ocean, forest, grape, mono
fps = 15                    # animation frames per second, 2..=60
language = ""               # interface language: en, de, es, fr, it, pt ("" = auto-detect from $LANG)
